<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{display:flex;align-items:center;justify-content:center;height:100vh;padding:1rem}</style>
</head>
<body>
  <div class="card shadow-sm" style="max-width:420px;width:100%">
    <div class="card-body">
      <h5 class="card-title">Admin Login</h5>
      <p class="text-muted small">Enter your admin credentials to continue.</p>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Email or ID</label>
          <input id="userId" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input id="password" type="password" class="form-control" required>
        </div>

        <div id="alert" class="alert d-none" role="alert"></div>

        <div class="d-flex justify-content-between align-items-center">
          <button class="btn btn-primary" type="submit">Login</button>
          <a href="index.html" class="btn btn-link">Back</a>
        </div>

        <div class="mt-3 small text-muted">
          <strong>Note</strong>: For production, this form must POST to a secure server endpoint that validates bcrypt hashes from a protected store. Do not validate credentials in client-side JS.
        </div>
      </form>
    </div>
  </div>

  <script>
    const AUTH_ENDPOINT = '/api/auth/login'; // implement server-side
    const MASTER_JSON = 'data/master.json';

    async function postAuth(payload) {
      try {
        const res = await fetch(AUTH_ENDPOINT, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(payload)
        });
        if (res.status === 404) throw new Error('no-auth-endpoint');
        return await res.json();
      } catch (err) {
        if (err.message === 'no-auth-endpoint') throw err;
        throw err;
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('userId').value.trim();
      const pw = document.getElementById('password').value;
      const alertEl = document.getElementById('alert');

      // Try server-side auth first
      try {
        const result = await postAuth({role:'admin', id, password: pw});
        // expected: { success:true, token:"...", user:{id,displayName,role} }
        if (result && result.success) {
          // store token securely; for demo we use sessionStorage
          sessionStorage.setItem('mms_token', result.token);
          sessionStorage.setItem('mms_user', JSON.stringify(result.user));
          window.location.href = 'admin.html';
          return;
        } else {
          alertEl.className = 'alert alert-danger';
          alertEl.textContent = result?.message || 'Invalid credentials';
          alertEl.classList.remove('d-none');
          return;
        }
      } catch (err) {
        if (err.message === 'no-auth-endpoint') {
          // Demo fallback: attempt client-side demo check using master.json
          try {
            const res = await fetch(MASTER_JSON);
            const master = await res.json();
            const admin = (master.roles?.admins || []).find(a => a.id === id || a.email === id);
            if (!admin) {
              alertEl.className = 'alert alert-danger';
              alertEl.textContent = 'Admin not found (demo mode)';
              alertEl.classList.remove('d-none');
              return;
            }
            // DEMO MODE: do not use in production. Accept password "demo1234" only for local demos.
            if (pw === 'demo1234') {
              sessionStorage.setItem('mms_token', 'demo-token-admin');
              sessionStorage.setItem('mms_user', JSON.stringify({id:admin.id,displayName:admin.displayName,role:'admin'}));
              window.location.href = 'admin.html';
              return;
            } else {
              alertEl.className = 'alert alert-danger';
              alertEl.textContent = 'Invalid password (demo mode)';
              alertEl.classList.remove('d-none');
              return;
            }
          } catch (e) {
            alertEl.className = 'alert alert-warning';
            alertEl.textContent = 'Auth service unavailable and demo fallback failed.';
            alertEl.classList.remove('d-none');
            return;
          }
        } else {
          alertEl.className = 'alert alert-danger';
          alertEl.textContent = 'Authentication error';
          alertEl.classList.remove('d-none');
        }
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
