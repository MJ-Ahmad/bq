<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Login - Baitul Quran International Madrasha</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f8f9fa;
      font-family: 'Segoe UI', sans-serif;
    }
    .login-container {
      max-width: 400px;
      margin: 80px auto;
      padding: 30px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      text-align: center;
    }
    .login-container img {
      height: 80px;
      margin-bottom: 15px;
    }
    .login-container h1 {
      font-size: 1.2rem;
      margin-bottom: 10px;
      color: #004080;
    }
    .login-container p {
      margin: 5px 0;
    }
    .footer-note {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <img src="assets/logo.png" alt="Logo">
    <h1>Baitul Quran International Madrasha</h1>
    <p><strong>Student Login</strong></p>
    <p>🔐 Password required</p>
    <p>This page is protected. Enter the correct password to view content.</p>

    <form onsubmit="return authenticateStudent();">
      <div class="mb-3">
        <input type="text" id="studentId" class="form-control" placeholder="Student ID" required>
      </div>
      <div class="mb-3">
        <input type="password" id="studentPassword" class="form-control" placeholder="Password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Unlock</button>
    </form>

    <div class="footer-note">
      <p>If you need to change the password or have any questions, contact: <strong>abn-bq@outlook.com</strong></p>
    </div>
  </div>

  <script>
    // Student credentials mapping
    const studentCredentials = {
      "BQSHK01": { password: "12345", link: "students/groups/a/01/index.html" },
      "BQSHK02": { password: "12345", link: "students/groups/a/02/index.html" },
      "BQSHK03": { password: "12345", link: "students/groups/a/03/index.html" },
      "BQSHK04": { password: "12345", link: "students/groups/a/04/index.html" },
      "BQSHK05": { password: "12345", link: "students/groups/a/05/index.html" },
      "BQSHK06": { password: "12345", link: "students/groups/a/06/index.html" },
      "BQSHK07": { password: "12345", link: "students/groups/a/07/index.html" },
      "BQSHK08": { password: "12345", link: "students/groups/a/08/index.html" },
      "BQSHK09": { password: "12345", link: "students/groups/a/09/index.html" },
      "BQSHK10": { password: "12345", link: "students/groups/a/10/index.html" }
    };

    function authenticateStudent() {
      const id = document.getElementById("studentId").value.trim();
      const pass = document.getElementById("studentPassword").value.trim();

      if (studentCredentials[id] && studentCredentials[id].password === pass) {
        window.location.href = studentCredentials[id].link;
      } else {
        alert("Invalid Student ID or Password!");
      }
      return false; // prevent form submission
    }
  </script>
</body>
</html>
