<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Parent Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{display:flex;align-items:center;justify-content:center;height:100vh;padding:1rem}</style>
</head>
<body>
  <div class="card shadow-sm" style="max-width:420px;width:100%">
    <div class="card-body">
      <h5 class="card-title">Parent Login</h5>
      <p class="text-muted small">Enter your parent credentials to continue.</p>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Parent ID or Email</label>
          <input id="userId" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input id="password" type="password" class="form-control" required>
        </div>

        <div id="alert" class="alert d-none" role="alert"></div>

        <div class="d-flex justify-content-between align-items-center">
          <button class="btn btn-primary" type="submit">Login</button>
          <a href="index.html" class="btn btn-link">Back</a>
        </div>

        <div class="mt-3 small text-muted">
          <strong>Note</strong>: For production, POST to a secure server endpoint that validates bcrypt hashes. Demo fallback accepts "demo1234".
        </div>
      </form>
    </div>
  </div>

  <script>
    const AUTH_ENDPOINT = '/api/auth/login';
    const MASTER_JSON = 'data/master.json';

    async function postAuth(payload) {
      const res = await fetch(AUTH_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      if (res.status === 404) throw new Error('no-auth-endpoint');
      return await res.json();
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('userId').value.trim();
      const pw = document.getElementById('password').value;
      const alertEl = document.getElementById('alert');

      try {
        const result = await postAuth({role:'parent', id, password: pw});
        if (result && result.success) {
          sessionStorage.setItem('mms_token', result.token);
          sessionStorage.setItem('mms_user', JSON.stringify(result.user));
          window.location.href = 'parent.html';
          return;
        } else {
          alertEl.className = 'alert alert-danger';
          alertEl.textContent = result?.message || 'Invalid credentials';
          alertEl.classList.remove('d-none');
          return;
        }
      } catch (err) {
        if (err.message === 'no-auth-endpoint') {
          try {
            const res = await fetch(MASTER_JSON);
            const master = await res.json();
            const parent = (master.roles?.parents || []).find(a => a.id === id || a.email === id);
            if (!parent) {
              alertEl.className = 'alert alert-danger';
              alertEl.textContent = 'Parent not found (demo mode)';
              alertEl.classList.remove('d-none');
              return;
            }
            if (pw === 'demo1234') {
              sessionStorage.setItem('mms_token', 'demo-token-parent');
              sessionStorage.setItem('mms_user', JSON.stringify({id:parent.id,displayName:parent.displayName,role:'parent',email:parent.email}));
              window.location.href = 'parent.html';
              return;
            } else {
              alertEl.className = 'alert alert-danger';
              alertEl.textContent = 'Invalid password (demo mode)';
              alertEl.classList.remove('d-none');
              return;
            }
          } catch (e) {
            alertEl.className = 'alert alert-warning';
            alertEl.textContent = 'Auth service unavailable and demo fallback failed.';
            alertEl.classList.remove('d-none');
            return;
          }
        } else {
          alertEl.className = 'alert alert-danger';
          alertEl.textContent = 'Authentication error';
          alertEl.classList.remove('d-none');
        }
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
