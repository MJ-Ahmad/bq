<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>About Baitul Quran</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{padding-top:70px}</style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img id="logo" src="assets/logo.png" alt="logo" height="36" class="me-2">
        <span id="title">Baitul Quran</span>
      </a>
      <div class="ms-auto d-flex align-items-center">
        <select id="langSelect" class="form-select form-select-sm me-2" style="width:auto">
          <option value="en">EN</option>
          <option value="bn">BN</option>
          <option value="ar">AR</option>
        </select>
        <a class="btn btn-outline-primary btn-sm" href="index.html">Back</a>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row">
      <div class="col-lg-8">
        <h2 id="aboutTitle">About Us</h2>
        <p id="aboutText">Loading...</p>

        <h3 id="programsTitle">Programs</h3>
        <ul id="programList" class="list-group mb-4"></ul>

        <h3 id="annTitle">Announcements</h3>
        <div id="announcements" class="list-group"></div>
      </div>

      <aside class="col-lg-4">
        <div class="card mb-3">
          <div class="card-body">
            <h5 id="contactTitle">Contact</h5>
            <p id="contactInfo">Loading...</p>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <h6>Quick Links</h6>
            <a class="btn btn-sm btn-outline-secondary mb-1 w-100" href="admin_password.html">Admin Login</a>
            <a class="btn btn-sm btn-outline-secondary mb-1 w-100" href="teacher_password.html">Teacher Login</a>
            <a class="btn btn-sm btn-outline-secondary mb-1 w-100" href="student_password.html">Student Login</a>
            <a class="btn btn-sm btn-outline-secondary mb-1 w-100" href="parent_password.html">Parent Login</a>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <footer class="bg-light py-4 text-center small" id="footerText">© 2026 Baitul Quran</footer>

  <script>
    const MASTER_JSON = 'data/master.json';
    let master = null;
    let lang = localStorage.getItem('mms_lang') || 'en';

    async function init() {
      try {
        const res = await fetch(MASTER_JSON);
        master = await res.json();
        apply();
      } catch (e) {
        console.warn('master.json load failed', e);
        document.getElementById('aboutText').textContent = 'Content unavailable';
      }
    }

    function apply() {
      if (!master) return;
      document.getElementById('title').textContent = master.meta.institutionName?.[lang] || master.meta.institutionName?.en;
      document.getElementById('aboutText').textContent = master.public?.about?.[lang] || master.public?.about?.en;
      document.getElementById('contactInfo').innerHTML = (master.navigation?.header?.contact?.phone || '') + '<br>' + (master.navigation?.header?.contact?.email || '');
      // announcements
      const ann = master.public?.announcements || [];
      const annContainer = document.getElementById('announcements');
      annContainer.innerHTML = '';
      ann.forEach(a => {
        const title = a.title?.[lang] || a.title?.en || '';
        const el = document.createElement('a');
        el.className = 'list-group-item list-group-item-action';
        el.href = '#';
        el.textContent = title + ' — ' + (a.date || '');
        annContainer.appendChild(el);
      });
      // programs from classes
      const programList = document.getElementById('programList');
      programList.innerHTML = '';
      (master.classes || []).forEach(c => {
        const li = document.createElement('li');
        li.className = 'list-group-item';
        li.textContent = c.name?.[lang] || c.name?.en;
        programList.appendChild(li);
      });
      document.getElementById('footerText').textContent = master.navigation?.footer?.copyright?.[lang] || master.navigation?.footer?.copyright?.en;
      document.getElementById('logo').src = master.ui?.logo || 'assets/logo.png';
    }

    document.getElementById('langSelect').value = lang;
    document.getElementById('langSelect').addEventListener('change', (e) => {
      lang = e.target.value;
      localStorage.setItem('mms_lang', lang);
      if (lang === 'ar') document.documentElement.dir = 'rtl'; else document.documentElement.dir = 'ltr';
      apply();
    });

    init();
    if (lang === 'ar') document.documentElement.dir = 'rtl';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
