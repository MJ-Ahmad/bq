<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Baitul Quran — Hifz Tracker</title>

  <style>
    :root{
      --accent:#0b6b5a;
      --muted:#6b7280;
      --bg:#f7f8fa;
      --card:#ffffff;
      --radius:10px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:#111}
    header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid #e6e9eb;position:sticky;top:0;z-index:20}
    .brand{display:flex;align-items:center;gap:12px}
    .brand img{height:44px;border-radius:8px}
    .brand .title{font-weight:700;font-size:16px;color:var(--accent)}
    .controls{display:flex;align-items:center;gap:10px}
    .lang-switch button{border:0;background:transparent;padding:6px 8px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
    .lang-switch button.active{background:var(--accent);color:#fff}
    #clock{font-weight:600;color:#222;font-size:14px}

    .container{max-width:1200px;margin:18px auto;padding:0 12px;display:grid;grid-template-columns:320px 1fr;gap:18px}
    aside{background:var(--card);padding:14px;border-radius:var(--radius);box-shadow:0 6px 18px rgba(10,10,10,0.04);height:calc(100vh - 140px);overflow:auto}
    main{background:var(--card);padding:18px;border-radius:var(--radius);box-shadow:0 6px 18px rgba(10,10,10,0.04);min-height:60vh;overflow:auto}

    h2{margin:0 0 8px 0;color:var(--accent)}
    .small-muted{color:var(--muted);font-size:13px}

    .nav-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
    .nav-list button{display:block;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid #eef2f3;background:#fff;cursor:pointer}
    .group-block{margin-bottom:12px}

    /* Hifz Tracker section */
    #hifzTracker{background:var(--card);padding:14px;border-radius:10px}
    .para-buttons{display:flex;flex-wrap:wrap;gap:8px}
    .para-btn{padding:8px 10px;border-radius:8px;border:1px solid #e6eef2;background:#fff;cursor:pointer;font-weight:600}
    .para-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .para-pages{margin-top:12px;display:none;gap:8px}
    .page-cell{padding:10px;border-radius:8px;text-align:center;background:#fafafa;border:1px solid #eee;font-size:14px;min-width:48px}
    .page-cell.memorized{background:#0b6b5a;color:#fff;border-color:#0b6b5a}
    .page-cell.taught{background:#00796b;color:#fff}
    .page-cell.planned{background:#f9a825;color:#000}
    .grid-pages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}

    .progress-wrap{margin-top:14px}
    .progress-bar{width:100%;background:#e6eef2;border-radius:999px;height:28px;overflow:hidden}
    .progress-fill{height:28px;background:linear-gradient(90deg,#0b6b5a,#0b9b7a);text-align:center;color:#fff;font-weight:700;line-height:28px}

    /* student summary */
    .student-summary{margin-top:12px;padding:12px;border-radius:8px;border:1px solid #eef2f3;background:#fff}
    .meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
    .meta-pill{background:#f1f7f5;padding:6px 10px;border-radius:8px;font-size:13px;color:var(--accent)}

    /* student tracker inside profile */
    #studentHifzTracker{margin-top:16px}
    .student-para-buttons{display:flex;flex-wrap:wrap;gap:8px}
    .student-para-btn{padding:8px 10px;border-radius:8px;border:1px solid #e6eef2;background:#fff;cursor:pointer;font-weight:600}
    .student-para-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .student-grid-pages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}

    /* footer */
    footer{margin-top:18px;padding:14px;text-align:center;color:var(--muted);font-size:13px}

    /* responsive */
    @media (max-width:980px){
      .container{grid-template-columns:1fr; padding:12px}
      aside{height:auto;order:2}
      main{order:1}
      .grid-pages{grid-template-columns:repeat(4,1fr)}
    }
    @media (max-width:520px){
      .grid-pages{grid-template-columns:repeat(2,1fr)}
      .student-grid-pages{grid-template-columns:repeat(2,1fr)}
      .para-btn{padding:6px 8px;font-size:13px}
      .student-para-btn{padding:6px 8px;font-size:13px}
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img id="logo" src="assets/logo.png" alt="logo">
      <div>
        <div class="title">Baitul Quran International Madrasha</div>
        <div class="small-muted">Hifz Department Tracker</div>
      </div>
    </div>

    <div class="controls">
      <div class="lang-switch" role="tablist" aria-label="Language switch">
        <button id="btn-en" class="active">EN</button>
        <button id="btn-bn">BN</button>
        <button id="btn-ar">AR</button>
      </div>
      <div id="clock" aria-live="polite">--:--:--</div>
    </div>
  </header>

  <div class="container">
    <aside>
      <h2 id="teachersTitle">Teachers</h2>
      <div id="teacher-nav" class="nav-list"></div>

      <div class="section-title" style="margin-top:12px">Groups</div>
      <div id="group-nav"></div>
    </aside>

    <main>
      <section id="hifzTracker">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h2 id="hifzTitle">Hifz Tracker</h2>
        </div>
      </section>

      <div id="studentArea" style="margin-top:18px"></div>
    </main>
  </div>

  <footer>
    © 2026 Baitul Quran International Madrasha — Stadium Road, Nandibari, Muktagacha, Mymensingh
  </footer>

  <script>
    // Configuration
    const MASTER_JSON = 'hifz.json';
    const PARAS = 30;
    const PAGES_PER_PARA = 20;

    // State
    let data = null;
    let groups = [];
    let currentLang = 'en';
    let selectedPara = 1;
    let selectedStudent = null;

    // Default localization (fallback)
    const defaultLocalization = {
      en: {
        teachers: "Teachers",
        groups: "Groups",
        select_prompt: "Click a teacher or student name",
        start_date: "Start Date",
        ustad: "Ustad",
        completed_paras: "Completed Paras",
        current_para: "Current Para",
        today_sabaq: "Today's Sabaq",
        tomorrow_prep: "Tomorrow's Prep",
        progress_30para: "30‑Para Progress",
        no_activity: "No recent activity"
      },
      bn: {
        teachers: "শিক্ষকগণ",
        groups: "গ্রুপসমূহ",
        select_prompt: "শিক্ষক বা শিক্ষার্থীর নাম ক্লিক করুন",
        start_date: "শুরু তারিখ",
        ustad: "উস্তাদ",
        completed_paras: "মুখস্থ পারা",
        current_para: "বর্তমান পারা",
        today_sabaq: "আজকের সাবাক",
        tomorrow_prep: "আগামীকালের প্রস্তুতি",
        progress_30para: "৩০ পারা অগ্রগতি",
        no_activity: "কোনো সাম্প্রতিক কার্যকলাপ নেই"
      },
      ar: {
        teachers: "المعلمون",
        groups: "المجموعات",
        select_prompt: "انقر اسم المعلم أو الطالب",
        start_date: "تاريخ البدء",
        ustad: "الأستاذ",
        completed_paras: "الأجزاء المحفوظة",
        current_para: "الجزء الحالي",
        today_sabaq: "درس اليوم",
        tomorrow_prep: "تحضير الغد",
        progress_30para: "تقدم 30 جزء",
        no_activity: "لا توجد أنشطة حديثة"
      }
    };

    // Header clock
    function updateHeaderClock(){
      const now = new Date();
      const opts = { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' };
      const locale = currentLang === 'bn' ? 'bn-BD' : (currentLang === 'ar' ? 'ar' : 'en-US');
      document.getElementById('clock').textContent = now.toLocaleString(locale, opts);
    }
    setInterval(updateHeaderClock, 1000);
    updateHeaderClock();

    // Language controls
    document.getElementById('btn-en').addEventListener('click', ()=> setLang('en'));
    document.getElementById('btn-bn').addEventListener('click', ()=> setLang('bn'));
    document.getElementById('btn-ar').addEventListener('click', ()=> setLang('ar'));
    function setLang(l){
      currentLang = l;
      document.querySelectorAll('.lang-switch button').forEach(b=>b.classList.remove('active'));
      document.getElementById('btn-'+(l==='en'?'en':l==='ar'?'ar':'bn')).classList.add('active');
      renderStaticLabels();
      if(selectedStudent) renderStudentSummary(selectedStudent);
      renderPara(selectedPara);
    }

    function L(key){
      const loc = (data && data.localization) ? data.localization : defaultLocalization;
      return (loc[currentLang] && loc[currentLang][key]) || (defaultLocalization[currentLang] && defaultLocalization[currentLang][key]) || key;
    }

    function renderStaticLabels(){
      document.getElementById('teachersTitle').textContent = L('teachers');
      document.getElementById('hifzTitle').textContent = 'Hifz Tracker';
      document.getElementById('selectedParaTitle').textContent = L('progress_30para') + ' — Select a Para to view pages';
    }

    // Utility: parse textual page ranges like "Pages 1–4" or "1-4, 6, 8–10" into absolute page numbers
    function parsePagesText(text){
      if(!text || typeof text !== 'string') return [];
      // normalize: remove "Pages", "Page", spaces around dashes
      let t = text.replace(/Pages?/ig, '').replace(/\s+/g, ' ').trim();
      // split by commas
      const parts = t.split(',').map(p => p.trim()).filter(Boolean);
      const pages = new Set();
      for(const part of parts){
        // match range like 1–4 or 1-4 or 1 — 4
        const m = part.match(/^(\d+)\s*[–—-]\s*(\d+)$/);
        if(m){
          const a = parseInt(m[1],10), b = parseInt(m[2],10);
          if(!isNaN(a) && !isNaN(b)){
            for(let i=Math.min(a,b); i<=Math.max(a,b); i++) pages.add(i);
          }
          continue;
        }
        // single number
        const n = parseInt(part,10);
        if(!isNaN(n)) pages.add(n);
      }
      return Array.from(pages).sort((a,b)=>a-b);
    }

    // Convert para+pageIndex to absolute page number (1..600)
    function absPage(para, pageIndex){ return (para - 1) * PAGES_PER_PARA + pageIndex; }

    // Load JSON and initialize
    async function loadMaster(){
      try{
        const res = await fetch(MASTER_JSON);
        if(!res.ok) throw new Error('Failed to load JSON: ' + res.status);
        data = await res.json();
        // ensure localization exists
        if(!data.localization) data.localization = defaultLocalization;
        groups = data['Hifz-Tracker']?.Groups || [];
        // auto-parse textual ranges into arrays for each student (today_pages, tomorrow_pages)
        groups.forEach(g => {
          g.students.forEach(s => {
            // parse completed_paras if string -> array of strings
            if(typeof s.completed_paras === 'string' && s.completed_paras.trim()){
              s.completed_paras = s.completed_paras.split(',').map(x=>x.trim()).filter(Boolean);
            }
            // parse today_sabaq -> today_pages if not present
            if((!Array.isArray(s.today_pages) || s.today_pages.length===0) && s.today_sabaq){
              const parsed = parsePagesText(s.today_sabaq);
              // if parsed numbers look like absolute pages (1..600) use them; if they look like small numbers (1..20) assume they are page indexes for current para and convert later when rendering per-para
              s.today_pages = parsed;
            }
            if((!Array.isArray(s.tomorrow_pages) || s.tomorrow_pages.length===0) && s.tomorrow_prep){
              const parsed = parsePagesText(s.tomorrow_prep);
              s.tomorrow_pages = parsed;
            }
          });
        });

        renderSidebar();
        renderParaButtons();
        updateOverallStats();
        renderPara(selectedPara);
        renderStaticLabels();
      }catch(err){
        console.error(err);
        document.getElementById('overall-status').textContent = 'Error loading data';
      }
    }

    // Sidebar rendering
    function renderSidebar(){
      const teachers = data['Hifz-Tracker']?.Teachers || [];
      const tnav = document.getElementById('teacher-nav');
      tnav.innerHTML = teachers.map(t => `<button onclick="showTeacher('${escapeHtml(t.name)}')">${escapeHtml(t.name)}</button>`).join('');

      const gnav = document.getElementById('group-nav');
      gnav.innerHTML = '';
      groups.forEach(g => {
        const block = document.createElement('div');
        block.className = 'group-block';
        const heading = document.createElement('div');
        heading.innerHTML = `<strong>Group ${escapeHtml(g.group)}</strong> <div class="small-muted">(${escapeHtml(g.ustad)})</div>`;
        block.appendChild(heading);

        const list = document.createElement('div');
        list.className = 'nav-list';
        g.students.forEach(s => {
          const btn = document.createElement('button');
          btn.textContent = s.name;
          btn.addEventListener('click', ()=> selectStudent(s.id, g.group));
          list.appendChild(btn);
        });
        block.appendChild(list);
        gnav.appendChild(block);
      });
    }

    // Para buttons 1..30
    function renderParaButtons(){
      const container = document.getElementById('paraButtons');
      container.innerHTML = '';
      for(let p=1;p<=PARAS;p++){
        const btn = document.createElement('button');
        btn.className = 'para-btn';
        btn.textContent = 'Para ' + p;
        btn.dataset.para = p;
        btn.addEventListener('click', ()=> {
          if(selectedPara === p && document.getElementById('paraPagesContainer').style.display === 'block'){
            document.getElementById('paraPagesContainer').style.display = 'none';
            btn.classList.remove('active');
          } else {
            selectedPara = p;
            document.querySelectorAll('.para-btn').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('paraPagesContainer').style.display = 'block';
            renderPara(p);
          }
        });
        container.appendChild(btn);
      }
    }

    // Render 20 pages for a para (aggregate view)
    function renderPara(para){
      document.getElementById('selectedParaTitle').textContent = `Para ${para} — Pages`;
      const pagesEl = document.getElementById('paraPages');
      pagesEl.innerHTML = '';
      for(let i=1;i<=PAGES_PER_PARA;i++){
        const cell = document.createElement('div');
        cell.className = 'page-cell';
        cell.textContent = `Page ${i}`;
        pagesEl.appendChild(cell);
      }
    }

    // Update overall stats
    function updateOverallStats(){
      let totalStudents = 0;
      let totalCompletedParas = 0;
      for(const g of groups){
        for(const s of g.students || []){
          totalStudents++;
          const completed = Array.isArray(s.completed_paras) ? s.completed_paras.length : (typeof s.completed_paras === 'string' && s.completed_paras.trim() ? s.completed_paras.split(',').length : 0);
          totalCompletedParas += completed;
        }
      }
      const maxParas = PARAS * Math.max(1, totalStudents);
      const percent = maxParas ? Math.round((totalCompletedParas / maxParas) * 100) : 0;
      const bar = document.getElementById('overall-bar1');
      bar.style.width = percent + '%';
      bar.textContent = percent + '%';
      document.getElementById('overall-status').textContent = `${totalStudents} students • ${totalCompletedParas} paras completed (aggregate)`;
    }

    // Select student and render profile + student-specific 30-para tracker
    function selectStudent(studentId, groupKey){
      const grp = groups.find(g => g.group === groupKey);
      if(!grp) return;
      let student = grp.students.find(s => s.id === studentId || s.name === studentId);
      if(!student){
        student = grp.students.find(s => s.name === studentId);
        if(!student) return;
      }
      selectedStudent = student;
      renderStudentSummary(student, grp.ustad);
      renderStudentHifzTracker(student, grp.ustad);
      // if a para is currently open in main tracker, re-render to reflect student coloring
      renderPara(selectedPara);
    }

    // Render student summary card
    let studentCountdownTimer = null;
    function renderStudentSummary(student, ustadName){
      const area = document.getElementById('studentArea');
      const completed = Array.isArray(student.completed_paras) ? student.completed_paras.join(', ') : (student.completed_paras || '—');
      const targetDate = student.target_date || null;
      let countdownHtml = '';
      if(targetDate){
        const days = computeDaysLeft(targetDate);
        countdownHtml = `<div class="small-muted">Countdown to target: <strong>${days >= 0 ? days + ' days' : 'target passed'}</strong></div>`;
      }
      area.innerHTML = `
        <div class="student-summary">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
            <div>
              <div style="font-weight:700;font-size:18px">${escapeHtml(student.name)}</div>
              <div class="small-muted">Roll: ${escapeHtml(student.roll || '—')} • Dept: ${escapeHtml(student.department || '—')}</div>
              <div class="meta-row" style="margin-top:8px">
                <div class="meta-pill">${escapeHtml(L('start_date'))}: ${escapeHtml(student.start_date || '—')}</div>
                <div class="meta-pill">${escapeHtml(L('ustad'))}: ${escapeHtml(ustadName || '—')}</div>
                <div class="meta-pill">${escapeHtml(L('current_para'))}: ${escapeHtml(student.current_para || '—')}</div>
                <div class="meta-pill">${escapeHtml(L('completed_paras'))}: ${escapeHtml(completed)}</div>
              </div>
              <div style="margin-top:8px" class="small-muted">${escapeHtml(L('today_sabaq'))}: ${escapeHtml(student.today_sabaq || '—')} • ${escapeHtml(L('tomorrow_prep'))}: ${escapeHtml(student.tomorrow_prep || '—')}</div>
              ${countdownHtml}
            </div>
            <div style="min-width:160px;text-align:right">
              <div class="small-muted">Last activity</div>
              <div style="margin-top:8px">${(student.activity && student.activity.length) ? `<div class="small-muted">${escapeHtml(student.activity[0])}</div>` : `<div class="small-muted">${escapeHtml(L('no_activity'))}</div>`}</div>
            </div>
          </div>
        </div>
        <!-- student Hifz tracker placeholder -->
        <div id="studentHifzTracker"></div>
      `;
      // clear previous countdown timer
      if(studentCountdownTimer) { clearInterval(studentCountdownTimer); studentCountdownTimer = null; }
      if(targetDate){
        studentCountdownTimer = setInterval(()=> {
          // re-render small countdown line by re-calling renderStudentSummary to keep it simple
          renderStudentSummary(student, ustadName);
          renderStudentHifzTracker(student, ustadName); // keep tracker visible after re-render
        }, 60*1000);
      }
    }

    function computeDaysLeft(targetDate){
      const now = new Date();
      const t = new Date(targetDate + 'T23:59:59');
      const diff = t - now;
      return Math.ceil(diff / (1000*60*60*24));
    }

    // Escape helper
    function escapeHtml(s){
      if(s === undefined || s === null) return '';
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // Show teacher details
    function showTeacher(name){
      const t = (data['Hifz-Tracker']?.Teachers || []).find(x => x.name === name);
      if(!t) return;
      const area = document.getElementById('studentArea');
      area.innerHTML = `<div class="student-summary"><h3>${escapeHtml(t.name)}</h3><div class="small-muted">Role: ${escapeHtml(t.role || '—')} • Phone: ${escapeHtml(t.phone || '—')}</div></div>`;
    }

    // -------------------------
    // Student Hifz Tracker (30 Para inside profile)
    // -------------------------
    function renderStudentHifzTracker(student, ustadName){
      const container = document.getElementById('studentHifzTracker');
      container.innerHTML = `
        <section id="studentHifzTrackerInner">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <h3 id="studentHifzTitle" style="margin:0">30‑Para Tracker</h3>
            <div id="studentCountdown" class="small-muted">Target: ${escapeHtml(student.target_date || '—')}</div>
          </div>

          <div id="studentProgressWrap" style="margin-top:10px">
            <div style="width:100%;background:#e6eef2;border-radius:999px;height:22px;overflow:hidden">
              <div id="studentProgressFill" style="height:22px;background:linear-gradient(90deg,#0b6b5a,#0b9b7a);width:0%;text-align:center;color:#fff;font-weight:700;line-height:22px">0%</div>
            </div>
          </div>

          <div id="studentParaButtons" class="student-para-buttons" style="margin-top:12px"></div>

          <div id="studentParaPagesContainer" style="margin-top:12px;display:none">
            <h4 id="studentSelectedParaTitle" style="margin:0 0 8px 0">Para — Pages</h4>
            <div id="studentParaPages" class="student-grid-pages"></div>
          </div>
        </section>
      `;
      // compute progress and countdown
      renderStudentProgressAndCountdown(student);
      // render 30 para buttons
      renderParaButtonsForStudent(student);
    }

    // Render 30 para buttons for student
    function renderParaButtonsForStudent(student){
      const container = document.getElementById('studentParaButtons');
      container.innerHTML = '';
      for(let p=1; p<=PARAS; p++){
        const btn = document.createElement('button');
        btn.className = 'student-para-btn';
        btn.textContent = 'Para ' + p;
        btn.dataset.para = p;
        btn.addEventListener('click', () => {
          const pagesContainer = document.getElementById('studentParaPagesContainer');
          const currently = pagesContainer.style.display === 'block' && Number(document.getElementById('studentSelectedParaTitle').dataset.para) === p;
          if(currently){
            pagesContainer.style.display = 'none';
            btn.classList.remove('active');
          } else {
            document.querySelectorAll('#studentParaButtons .student-para-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('studentParaPagesContainer').style.display = 'block';
            document.getElementById('studentSelectedParaTitle').textContent = 'Para ' + p + ' — Pages';
            document.getElementById('studentSelectedParaTitle').dataset.para = p;
            renderParaPagesForStudent(selectedStudent, p);
          }
        });
        container.appendChild(btn);
      }
    }

    // Render 20 pages for a para for the selected student
    function renderParaPagesForStudent(student, para){
      const pagesEl = document.getElementById('studentParaPages');
      pagesEl.innerHTML = '';
      // prepare sets
      const completedParas = new Set(Array.isArray(student.completed_paras) ? student.completed_paras.map(String) : (typeof student.completed_paras === 'string' && student.completed_paras.trim() ? student.completed_paras.split(',').map(x=>x.trim()) : []));
      // today_pages and tomorrow_pages may be absolute page numbers (1..600) or small numbers; we will convert if necessary
      const todayPagesRaw = Array.isArray(student.today_pages) ? student.today_pages.slice() : [];
      const tomorrowPagesRaw = Array.isArray(student.tomorrow_pages) ? student.tomorrow_pages.slice() : [];

      // If parsed today_pages contain numbers <=20 and look like page indexes for current para, convert to absolute using current para
      const convertIfLocal = (arr) => {
        if(!arr || arr.length===0) return new Set();
        const allSmall = arr.every(n => Number(n) >= 1 && Number(n) <= 20);
        if(allSmall){
          // assume these are page indexes for the student's current_para if current_para matches para; otherwise assume they are absolute
          // We'll convert using the para argument passed to this function (the para being rendered)
          return new Set(arr.map(n => absPage(para, Number(n))));
        } else {
          // assume absolute page numbers already
          return new Set(arr.map(Number));
        }
      };

      const todayPages = convertIfLocal(todayPagesRaw);
      const tomorrowPages = convertIfLocal(tomorrowPagesRaw);

      for(let i=1; i<=PAGES_PER_PARA; i++){
        const cell = document.createElement('div');
        cell.className = 'page-cell';
        cell.textContent = 'Page ' + i;
        const abs = absPage(para, i);
        if(completedParas.has(String(para))){
          cell.classList.add('memorized');
          cell.title = `Para ${para} — memorized`;
        } else if(todayPages.has(abs)){
          cell.classList.add('taught');
          cell.title = `Page ${abs} — taught today`;
        } else if(tomorrowPages.has(abs)){
          cell.classList.add('planned');
          cell.title = `Page ${abs} — planned`;
        } else {
          cell.title = `Page ${abs}`;
        }
        pagesEl.appendChild(cell);
      }
    }

    // Render student progress and countdown inside profile
    let studentCountdownTimer2 = null;
    function renderStudentProgressAndCountdown(student){
      const completed = Array.isArray(student.completed_paras) ? student.completed_paras.length : (typeof student.completed_paras === 'string' && student.completed_paras.trim() ? student.completed_paras.split(',').length : 0);
      const percent = Math.round((completed / PARAS) * 100);
      const fill = document.getElementById('studentProgressFill');
      if(fill){
        fill.style.width = percent + '%';
        fill.textContent = percent + '%';
      }
      const countdownEl = document.getElementById('studentCountdown');
      if(studentCountdownTimer2) { clearInterval(studentCountdownTimer2); studentCountdownTimer2 = null; }
      if(student.target_date){
        function updateCountdown(){
          const now = new Date();
          const t = new Date(student.target_date + 'T23:59:59');
          const diff = t - now;
          if(diff >= 0){
            const days = Math.floor(diff / (1000*60*60*24));
            const hours = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
            const mins = Math.floor((diff % (1000*60*60)) / (1000*60));
            const secs = Math.floor((diff % (1000*60)) / 1000);
            countdownEl.textContent = `Target: ${student.target_date} — ${days}d ${hours}h ${mins}m ${secs}s`;
          } else {
            countdownEl.textContent = `Target: ${student.target_date} — target passed`;
          }
        }
        updateCountdown();
        studentCountdownTimer2 = setInterval(updateCountdown, 1000);
      } else {
        if(countdownEl) countdownEl.textContent = 'Target: —';
      }
    }

    // Expose functions for sidebar buttons
    window.selectStudent = selectStudent;
    window.showTeacher = showTeacher;

    // Initial load
    loadMaster();
  </script>
</body>
