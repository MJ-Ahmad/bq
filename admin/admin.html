<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Baitul Quran</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root{
      --accent:#0b6b5a;
      --muted:#666;
      --card-bg:#fff;
      --bg:#f7f8fa;
    }
    body{font-family:Inter, "Segoe UI", Arial, sans-serif; margin:0; background:var(--bg); color:#111;}
    header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:#fff;border-bottom:1px solid #e6e9eb;position:sticky;top:0;z-index:10}
    .brand{display:flex;align-items:center;gap:12px}
    .brand img{height:44px;border-radius:6px}
    .brand .title{font-weight:700;font-size:18px;color:var(--accent)}
    .controls{display:flex;align-items:center;gap:10px}
    .lang-switch button{border:0;background:transparent;padding:6px 8px;border-radius:6px;cursor:pointer}
    .lang-switch button.active{background:var(--accent);color:#fff}
    #clock{font-weight:600;color:#222}
    .layout{display:grid;grid-template-columns:320px 1fr;gap:18px;padding:18px;max-width:1200px;margin:18px auto}
    aside{background:var(--card-bg);padding:14px;border-radius:10px;box-shadow:0 6px 18px rgba(10,10,10,0.04);height:calc(100vh - 120px);overflow:auto}
    main{background:var(--card-bg);padding:18px;border-radius:10px;box-shadow:0 6px 18px rgba(10,10,10,0.04);min-height:60vh;overflow:auto}
    h2{margin:0 0 10px 0;color:var(--accent)}
    .section-title{font-size:14px;color:var(--muted);margin:8px 0}
    .nav-list{display:flex;flex-direction:column;gap:8px}
    .nav-list button{display:block;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid #eef2f3;background:#0c0707;cursor:pointer}
    .group-block{margin-bottom:12px}
    .student-card{max-width:900px}
    .meta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
    .meta-pill{background:#f1f7f5;padding:6px 10px;border-radius:8px;font-size:13px;color:#0b6b5a}
    .muted{color:var(--muted)}
    .paras-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px}
    .para-cell{padding:8px;border-radius:6px;text-align:center;background:#fafafa;border:1px solid #f0f0f0;font-size:13px}
    .para-cell.done{background:#0b6b5a;color:#fff;border-color:#0b6b5a}
    .small{font-size:13px;color:var(--muted)}
    .log-list{margin-top:10px;border-top:1px dashed #eee;padding-top:10px}
    .countdown{font-weight:700;color:#b71c1c}
    @media (max-width:980px){
      .layout{grid-template-columns:1fr; padding:12px}
      aside{height:auto;order:2}
      main{order:1}
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img id="logo" src="assets/logo.png" alt="logo">
      <div>
        <div class="title">Baitul Quran</div>
        <div class="small muted">Quran Memorization</div>
      </div>
    </div>

    <div class="controls">
      <div class="lang-switch" role="tablist" aria-label="Language switch">
        <button id="btn-en">EN</button>
        <button id="btn-bn" class="active">BN</button>
        <button id="btn-ar">AR</button>
      </div>
      <div id="clock" aria-live="polite">--:--:--</div>
    </div>
  </header>

  <div class="layout">
    <aside>
      <h2>Teachers</h2>
      <div id="teacher-nav" class="nav-list"></div>

      <div class="section-title">Groups</div>
      <div id="group-nav"></div>
    </aside>

    <main id="content">
      <h2>শিক্ষক বা শিক্ষার্থীর নাম ক্লিক করুন</h2>
      <p class="muted">Select a teacher to view details or click a student to open the profile card with real‑time clock, countdown and progress.</p>
    </main>
  </div>

  <script>
    // Real-time clock (header)
    function updateHeaderClock(){
      const now = new Date();
      const opts = { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' };
      document.getElementById('clock').textContent = now.toLocaleString('en-BD', opts);
    }
    setInterval(updateHeaderClock, 1000);
    updateHeaderClock();

    // Language buttons (visual only; extend to load localized strings)
    document.getElementById('btn-en').addEventListener('click', ()=> setLang('en'));
    document.getElementById('btn-bn').addEventListener('click', ()=> setLang('bn'));
    document.getElementById('btn-ar').addEventListener('click', ()=> setLang('ar'));
    function setLang(l){
      document.querySelectorAll('.lang-switch button').forEach(b=>b.classList.remove('active'));
      document.getElementById('btn-'+(l==='en'?'en':l==='ar'?'ar':'bn')).classList.add('active');
      // future: reload localized labels from JSON
    }

    // Fetch and render data
    async function loadData(){
      try{
        const res = await fetch('hifzmaster.json');
        if(!res.ok) throw new Error('Failed to load JSON: ' + res.status);
        const data = await res.json();
        const teachers = data['Hifz-Tracker'].Teachers || [];
        const groups = data['Hifz-Tracker'].Groups || [];

        // Teachers
        const tnav = document.getElementById('teacher-nav');
        tnav.innerHTML = teachers.map(t => `<button onclick="showTeacher('${escapeHtml(t.name)}')">${escapeHtml(t.name)}</button>`).join('');

        // Groups and students
        const gnav = document.getElementById('group-nav');
        gnav.innerHTML = '';
        groups.forEach(g => {
          const block = document.createElement('div');
          block.className = 'group-block';
          const heading = document.createElement('div');
          heading.innerHTML = `<strong>Group ${escapeHtml(g.group)}</strong> <span class="small muted">(${escapeHtml(g.ustad)})</span>`;
          block.appendChild(heading);

          const list = document.createElement('div');
          list.className = 'nav-list';
          g.students.forEach(s => {
            const btn = document.createElement('button');
            btn.textContent = s.name;
            btn.addEventListener('click', ()=> showStudent(s.id, g.group));
            list.appendChild(btn);
          });
          block.appendChild(list);
          gnav.appendChild(block);
        });

        // store globally
        window.__HFZ = { teachers, groups };
      }catch(err){
        console.error(err);
        document.getElementById('content').innerHTML = `<div class="card"><div style="padding:12px"><strong class="muted">Error loading data</strong><div class="small">${escapeHtml(err.message)}</div></div></div>`;
      }
    }

    function showTeacher(name){
      const t = (window.__HFZ?.teachers || []).find(x => x.name === name);
      if(!t) return;
      document.getElementById('content').innerHTML = `
        <div class="card teacher-card">
          <h2>${escapeHtml(t.name)}</h2>
          <div class="meta-row">
            <div class="meta-pill">Role: ${escapeHtml(t.role || '—')}</div>
            <div class="meta-pill">Phone: ${escapeHtml(t.phone || '—')}</div>
          </div>
          <div class="log-list small">
            <p class="muted">Assigned groups and students are shown in the left sidebar.</p>
          </div>
        </div>
      `;
    }

    // Show student by id (id may be 'pending' for some)
    function showStudent(id, groupKey){
      const groups = window.__HFZ?.groups || [];
      const grp = groups.find(g => g.group === groupKey);
      if(!grp) return;
      const student = grp.students.find(s => s.id === id || s.name === id);
      // if id is actual id string, find by id; if not found, try by name
      if(!student){
        // try by name fallback
        const sByName = grp.students.find(s => s.name === id);
        if(sByName) student = sByName;
      }
      if(!student){
        document.getElementById('content').innerHTML = `<div class="card"><div style="padding:12px"><p class="muted">Student not found in group ${escapeHtml(groupKey)}</p></div></div>`;
        return;
      }

      // Build completed paras array
      const completed = Array.isArray(student.completed_paras) ? student.completed_paras : (typeof student.completed_paras === 'string' && student.completed_paras.trim() ? student.completed_paras.split(',').map(x=>x.trim()) : []);
      const currentPara = student.current_para || '—';
      const startDate = student.start_date || '—';
      const todaySabaq = student.today_sabaq || '—';
      const tomorrowPrep = student.tomorrow_prep || '—';
      const targetDate = student.target_date || null;

      // countdown
      let countdownHTML = '';
      if(targetDate){
        const now = new Date();
        const t = new Date(targetDate + 'T23:59:59');
        const diffMs = t - now;
        if(diffMs >= 0){
          const days = Math.floor(diffMs / (1000*60*60*24));
          countdownHTML = `<div class="meta-pill countdown">Target: ${escapeHtml(targetDate)} — ${days} days left</div>`;
        } else {
          countdownHTML = `<div class="meta-pill small">Target date passed (${escapeHtml(targetDate)})</div>`;
        }
      }

      // paras grid (1..30)
      let parasHTML = '';
      for(let i=1;i<=30;i++){
        const done = completed.includes(String(i)) || completed.includes(String(i).padStart(2,'0'));
        parasHTML += `<div class="para-cell ${done ? 'done' : ''}">Para ${i}</div>`;
      }

      // today sabaq log (if detailed logs exist)
      const todayLog = student.today_log || null;
      const todayLogHTML = todayLog ? `<div class="small"><strong>Today log:</strong> ${escapeHtml(todayLog)}</div>` : '';

      document.getElementById('content').innerHTML = `
        <div class="card student-card">
          <h2>${escapeHtml(student.name)}</h2>
          <div class="meta-row" style="margin-top:8px">
            <div class="meta-pill">Roll: ${escapeHtml(student.roll || '—')}</div>
            <div class="meta-pill">ID: ${escapeHtml(student.id || '—')}</div>
            <div class="meta-pill">Dept: ${escapeHtml(student.department || '—')}</div>
            <div class="meta-pill">Group: ${escapeHtml(groupKey)}</div>
            <div class="meta-pill">Ustad: ${escapeHtml(grp.ustad || '—')}</div>
            <div class="meta-pill">Start: ${escapeHtml(startDate)}</div>
            ${countdownHTML}
          </div>

          <div style="margin-top:12px">
            <div class="small"><strong>Completed Paras:</strong> ${completed.length ? escapeHtml(completed.join(', ')) : '—'}</div>
            <div class="small"><strong>Current Para:</strong> ${escapeHtml(currentPara)}</div>
            <div class="small"><strong>Today's Sabaq:</strong> ${escapeHtml(todaySabaq)}</div>
            <div class="small"><strong>Tomorrow's Prep:</strong> ${escapeHtml(tomorrowPrep)}</div>
            ${todayLogHTML}
          </div>

          <div style="margin-top:14px">
            <h3 class="small muted">30‑Para Progress</h3>
            <div class="paras-grid">${parasHTML}</div>
          </div>

          <div class="log-list">
            <h4 class="small muted">Recent Activity</h4>
            <ul id="activity-list" class="small">
              ${student.activity && student.activity.length ? student.activity.map(a => `<li>${escapeHtml(a)}</li>`).join('') : '<li class="muted">No recent activity recorded.</li>'}
            </ul>
          </div>
        </div>
      `;

      // start a per-profile real-time clock (optional)
      startProfileClock();
      // start per-student countdown updater
      startCountdownUpdater(targetDate);
    }

    // small helper: escape
    function escapeHtml(s){
      if(s === undefined || s === null) return '';
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // profile clock (if you want a separate clock inside profile)
    function startProfileClock(){
      // currently header clock is enough; placeholder for per-profile realtime features
    }

    // countdown updater (re-renders countdown pill every minute)
    let countdownInterval = null;
    function startCountdownUpdater(targetDate){
      if(countdownInterval) clearInterval(countdownInterval);
      if(!targetDate) return;
      countdownInterval = setInterval(()=>{
        const pill = document.querySelector('.meta-pill.countdown');
        if(!pill) return;
        const now = new Date();
        const t = new Date(targetDate + 'T23:59:59');
        const diffMs = t - now;
        if(diffMs >= 0){
          const days = Math.floor(diffMs / (1000*60*60*24));
          pill.textContent = `Target: ${targetDate} — ${days} days left`;
        } else {
          pill.textContent = `Target date passed (${targetDate})`;
        }
      }, 60*1000);
    }

    // initial load
    loadData();
  </script>
</body>
</html>
